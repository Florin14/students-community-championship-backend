# Configuration for every service in this stack.
#
# Kept out of docker-compose.yml on purpose - the compose file says WHAT runs and
# in what order, this file says what each container is TOLD. Same split as the
# other platforms in the workspace, so the two can be reviewed separately.
#
# Every value is `${VAR:-default}`. The defaults are the ones that make a plain
# `docker compose up` work against the bundled Postgres from local_db.yml; every
# deployed environment overrides them through its own untracked .env or through
# CI variables. Real secrets never get a real value here (CORE-020).

x-api-env: &api-env
  ENV: ${ENV:-local}
  APP_ENV: ${ENV:-local}
  TZ: Europe/Bucharest
  PYTHONUNBUFFERED: 1
  PORT: 8000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Deployed environments point this at Neon (or any managed Postgres). The
  # default targets the `postgres` service, which only the local override file
  # brings up - see local_db.yml.
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-scc}}
  # Connection pool per API process - see .env.template for how to size it
  # against the provider's connection limit.
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
  # Alembic owns the schema in every containerised environment. create_all is a
  # local-checkout convenience only and stays off here.
  AUTO_CREATE_TABLES: "false"
  # The first super-admin, seeded after the migrations by the `migrate` job,
  # only when no administrator exists yet. Shared with the API because it is the
  # same contract in checkout mode. Left empty deliberately: with no password
  # nothing is seeded and a warning is logged, which is the right behaviour for
  # a deployment whose administrator is created by hand.
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@scc.ro}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
  DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Administrator}
  # Escape hatch for a service that shares a database it does not own: true
  # makes the migration step exit without touching anything.
  SKIP_MIGRATION: ${SKIP_MIGRATION:-false}
  # Which callable populates the defaults after the schema reaches head. Same
  # contract as the other platforms; only the module path follows this repo's
  # layout. Shared by both services because the API runs the same step when
  # RUN_MIGRATIONS is on.
  DEFAULTS_POPULATE_FILE: ${DEFAULTS_POPULATE_FILE:-services.populate_defaults}
  DEFAULTS_POPULATE_FUNCTION: ${DEFAULTS_POPULATE_FUNCTION:-populate_defaults}

services:
  # Schema to head, then the default rows - services/run_migrations.py.
  migrate:
    environment:
      <<: *api-env

  api:
    environment:
      <<: *api-env
      # The migration job has already run - schema AND defaults - by the time
      # this container starts (depends_on: service_completed_successfully), so
      # the API never races it and its own startup stays read-only. Flip to true
      # only for a single-replica environment with no job step.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      # Every browser origin allowed to call the API - add each deployed
      # frontend origin here, comma separated.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Placeholder by design. The entrypoint refuses to serve with this value
      # when ENV is anything other than `local`.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-a-secret}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-720}
