# Render Blueprint - the backend as Infrastructure-as-Code.
#
# Render > Blueprints > New Blueprint Instance > pick this repo. Render reads
# this file, creates the service and asks for every `sync: false` value once.
# After that the file IS the configuration: changing a value here and pushing
# updates the service (a Blueprint sync), and the dashboard shows the drift.
#
# Deploys are NOT triggered by Render's own push hook (autoDeploy: false). The
# GitHub Actions workflow in .github/workflows/ci.yml runs the test suite on
# Postgres first and only then calls the service's deploy hook, so a commit
# that breaks a migration never reaches production.
#
# The frontend is not here: it is a static Vite bundle on Vercel. Its origin
# has to be listed in ALLOWED_ORIGINS below, and its VITE_API_URL has to point
# at this service's public URL.

services:
  - type: web
    name: scc-backend
    runtime: docker
    repo: https://github.com/Florin14/students-community-championship-backend
    branch: master
    region: frankfurt          # next to Neon eu-central-1; keeps DB latency low
    plan: free                 # spins down after 15 min idle; `starter` stays warm
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false          # CI deploys via the hook after the tests pass
    # Paid instance types can run the migration job as a separate step before
    # the new container takes traffic - the same shape as the compose `migrate`
    # service. On the free plan the command is not available, so RUN_MIGRATIONS
    # below makes the single replica apply them at start-up instead. When you
    # move to a paid plan: uncomment this and set RUN_MIGRATIONS to "false".
    # preDeployCommand: /usr/local/bin/entrypoint.sh migrate
    envVars:
      # --- identity ---------------------------------------------------------
      - key: APP_ENV
        value: production
      - key: ENV
        value: production
      - key: TZ
        value: Europe/Bucharest
      - key: LOG_LEVEL
        value: INFO
      # The entrypoint and the image HEALTHCHECK both listen on PORT; Render
      # routes to whatever port the container binds.
      - key: PORT
        value: "8000"

      # --- database (Neon) --------------------------------------------------
      # Paste the Neon connection string. `sslmode=require` is added by the
      # app for *.neon.tech hosts, so the plain string from the console works.
      - key: DATABASE_URL
        sync: false
      # Free tier = one replica, so the container applies the migrations and
      # the default rows itself at start-up (services/run_migrations.py).
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_CONNECT_TIMEOUT
        value: "10"

      # --- auth ---------------------------------------------------------------
      # Render generates a random value once and keeps it; rotating it logs
      # every admin out, which is the intended effect of rotating it.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"

      # --- CORS ---------------------------------------------------------------
      # Every browser origin allowed to call the API, comma separated: the
      # Vercel production domain and, if you use them, the custom domain.
      # e.g. https://scc.vercel.app,https://campionat.example.ro
      - key: ALLOWED_ORIGINS
        sync: false

      # --- first super-admin --------------------------------------------------
      # Seeded once, only while no administrator exists. Change the password
      # from the app afterwards or clear this value; it is never re-applied.
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@scc.ro
      - key: DEFAULT_ADMIN_NAME
        value: Administrator
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
