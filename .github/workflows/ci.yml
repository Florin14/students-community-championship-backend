# Test on every push and pull request; deploy to Render only from `master`,
# and only after the tests and the image build have passed.
#
# Repository settings this workflow needs (Settings > Secrets and variables >
# Actions):
#
#   secret   RENDER_DEPLOY_HOOK_URL   the service's Deploy Hook (Render >
#                                     scc-backend > Settings > Deploy Hook)
#   variable RENDER_API_URL           the service's public URL, e.g.
#                                     https://scc-backend.onrender.com
#                                     (optional: enables the post-deploy check)
#
# Render itself is told NOT to auto-deploy on push (render.yaml,
# autoDeploy: false), so this workflow is the only path to production.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter as the runtime image (Dockerfile: python:3.12-slim).
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        env:
          # Each module creates and drops its own database on this server.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET_KEY: ci-only-secret
          DEFAULT_ADMIN_PASSWORD: ci-only-password
          LOG_LEVEL: WARNING
        run: python tests/run_all.py

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # A GitHub "environment" gives the deploy its own history in the Actions
    # tab and lets you add required reviewers later without touching this file.
    environment:
      name: production
      url: ${{ vars.RENDER_API_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger the Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo
          echo "deploy requested for ${{ github.sha }}"

      - name: Wait until /version reports this commit
        if: vars.RENDER_API_URL != ''
        run: |
          base="${{ vars.RENDER_API_URL }}"
          base="${base%/}"
          want="${{ github.sha }}"
          # Docker build + rollout on the free plan takes a few minutes; a cold
          # start adds up to a minute more.
          for i in $(seq 1 60); do
            got="$(curl -fsS --max-time 20 "$base/version" 2>/dev/null \
                   | sed -n 's/.*"gitSha":"\([0-9a-f]*\)".*/\1/p')" || true
            if [ -n "$got" ] && [ "${want#$got}" != "$want" ]; then
              echo "live: $base/version reports $got"
              exit 0
            fi
            echo "attempt $i: live sha is '${got:-unreachable}', waiting..."
            sleep 15
          done
          echo "::error::$base never reported $want within 15 minutes"
          exit 1
